name: update-versions

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  grok-build-bin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    defaults:
      run:
        shell: bash -uo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: upstream version  
        id: upstream
        run: |
          version=$(curl -fsS https://x.ai/cli/stable | tr -d '[:space:]')
          echo "Upstream (x.ai) stable version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      
      - name: pkgbuild version
        id: pkgbuild
        run: |
          pkgbuild_file="packages/grok-build-bin/PKGBUILD"
          if [[ ! -f "$pkgbuild_file" ]]; then
            echo "ERROR: $pkgbuild_file not found"
            exit 1
          fi

          # TODO replace sourcing
          . "$pkgbuild_file"
          if [[ ! "$pkgver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: PKGBUILD pkgver is not in x.y.z format: $pkgver"
            exit 1
          fi

          echo "PKGBUILD version: $pkgver"
          echo "version=$pkgver" >> "$GITHUB_OUTPUT"

      - name: compare versions
        id: compare
        run: |

          # TODO source PKGBUILD and get pkgver instead of hardcoding it here
      
          upstream_version="${{ steps.upstream.outputs.version }}"
          pkgbuild_version="${{ steps.pkgbuild.outputs.version }}"
      
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "pkgbuild_version=$pkgbuild_version" >> "$GITHUB_OUTPUT"
      
          if [[ "$pkgbuild_version" == "$upstream_version" ]]; then
            echo "Versions are identical. Nothing to do."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
      
          lowest=$(printf '%s\n' "$pkgbuild_version" "$upstream_version" | sort -V | head -n1)
          # TODO compare with dpkg
          if [[ "$lowest" == "$pkgbuild_version" ]]; then
            echo "PKGBUILD is older than upstream → update needed"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "PKGBUILD is NEWER than upstream. Please check manually."
            exit 1
          fi

      - name: Print versions
        run: |
          echo "Upstream : ${{ steps.compare.outputs.upstream_version }}"
          echo "PKGBUILD : ${{ steps.compare.outputs.pkgbuild_version }}"
          echo "has_update = ${{ steps.compare.outputs.has_update }}"

      - name: Notify about new version
        if: steps.compare.outputs.has_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.compare.outputs.upstream_version }}";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New grok-build version: ${version}`,
              body: `@olwig\n\nNew version found: **${version}**\n\nPlease update the PKGBUILD for \`grok-build-bin\`.`
            });
            
  grok-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:

      - name: Find pin from changelog candidates
        run: |
          echo "============================================================="
          echo "Fetching changelog from $search_url..."
          search_url="https://raw.githubusercontent.com/xai-org/grok-build/refs/heads/main/crates/codegen/xai-grok-shell/CHANGELOG.md"
          changelog_md=$(curl -sSf "$search_url")
          mapfile -t candidates < <(grep '^# [0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]* — [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$' <<< "$changelog_md" | awk '{print $2}' | sort -Vr)

          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo "ERROR: no version candidates in changelog."
            exit 1
          fi
          echo "Changelog candidates (high to low): ${candidates[*]}"

          echo "============================================================="
          echo "Scanning cargo version bumps in $cargo_toml_path..."

          git_repo="https://github.com/xai-org/grok-build.git"
          cargo_toml_path="crates/codegen/xai-grok-pager-bin/Cargo.toml"

          tmp_repo_dir=$(mktemp -d)
          git clone --quiet --filter=blob:none --no-checkout "$git_repo" "$tmp_repo_dir"

          # oldest commit per cargo version (rev-list is newest-first; last write wins)
          declare -A earliest_commit_for
          declare -A parent_commit_for
          declare -A parent_version_for
          while read -r commit; do
            cargo_ver=$(git -C "$tmp_repo_dir" show "$commit:$cargo_toml_path" 2>/dev/null | grep '^version =' | head -n1 | cut -d '"' -f2 || true)
            if [[ -z "$cargo_ver" ]]; then
              continue
            fi
            earliest_commit_for["$cargo_ver"]="$commit"
            parent=$(git -C "$tmp_repo_dir" rev-parse "${commit}^" 2>/dev/null || true)
            parent_commit_for["$cargo_ver"]="$parent"
            parent_ver=""
            if [[ -n "$parent" ]]; then
              parent_ver=$(git -C "$tmp_repo_dir" show "$parent:$cargo_toml_path" 2>/dev/null | grep '^version =' | head -n1 | cut -d '"' -f2 || true)
            fi
            parent_version_for["$cargo_ver"]="$parent_ver"
          done < <(git -C "$tmp_repo_dir" rev-list --first-parent origin/HEAD -- "$cargo_toml_path")

          mapped_version=""
          mapped_commit=""
          for candidate in "${candidates[@]}"; do
            echo "============================================================="
            echo "Trying changelog candidate $candidate..."
            pin="${earliest_commit_for[$candidate]:-}"
            if [[ -z "$pin" ]]; then
              echo "Candidate $candidate not mirrored in $cargo_toml_path"
              continue
            fi
            parent_ver="${parent_version_for[$candidate]:-}"
            if [[ -n "$parent_ver" && "$parent_ver" == "$candidate" ]]; then
              echo "Candidate $candidate pin $pin parent still $candidate; skip"
              continue
            fi
            echo "Mapped candidate $candidate to commit $pin (parent ${parent_commit_for[$candidate]:-} ${parent_ver:-none})"
            mapped_version="$candidate"
            mapped_commit="$pin"
            break
          done

          if [[ -z "$mapped_version" ]]; then
            echo "not mirrored yet"
            echo "mapped=false" >> "$GITHUB_ENV"
            echo "has_update=false" >> "$GITHUB_ENV"
            echo "upstream_version=" >> "$GITHUB_ENV"
            echo "upstream_commit=" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "============================================================="
          echo "Changelog candidate $mapped_version corresponds to commit $mapped_commit"
          echo "mapped=true" >> "$GITHUB_ENV"
          echo "upstream_version=$mapped_version" >> "$GITHUB_ENV"
          echo "upstream_commit=$mapped_commit" >> "$GITHUB_ENV"

          echo "============================================================="
          echo "Checking mapped version against x.ai stable channel..."
          channel_note="x.ai stable channel check failed."
          stable_channel=$(curl -fsS https://x.ai/cli/stable | tr -d '[:space:]' || true)
          echo "x.ai stable channel: ${stable_channel:-unavailable}"
          echo "stable_channel=${stable_channel:-}" >> "$GITHUB_ENV"
          if [[ "$stable_channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "$mapped_version" == "$stable_channel" ]]; then
              channel_note="this version matches the x.ai stable channel."
            else
              lowest=$(printf '%s\n' "$mapped_version" "$stable_channel" | sort -V | head -n1)
              if [[ "$lowest" == "$mapped_version" ]]; then
                channel_note="this version is behind the x.ai stable channel (${stable_channel}). expected: public source has no newer pin."
              else
                channel_note="this version is ahead of the x.ai stable channel (${stable_channel}). check manually."
              fi
            fi
          fi
          echo "$channel_note"
          echo "channel_note=$channel_note" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PKGBUILD data
        if: ${{ env.mapped != 'false' }}
        run: |
          pkgbuild_file="packages/grok-build/PKGBUILD"
          if [[ ! -f "$pkgbuild_file" ]]; then
            echo "ERROR: $pkgbuild_file not found"
            exit 1
          fi

          # TODO replace sourcing
          . "$pkgbuild_file"
          if [[ ! "$pkgver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: PKGBUILD pkgver is not in x.y.z format: $pkgver"
            exit 1
          fi

          echo "PKGBUILD version: $pkgver"
          echo "pkgbuild_version=$pkgver" >> "$GITHUB_ENV"

      - name: Compare upstream to pkgbuild versions
        if: ${{ env.mapped != 'false' }}
        run: |
      
          if [[ "$pkgbuild_version" == "$upstream_version" ]]; then
            echo "Versions are identical. Nothing to do."
            echo "has_update=false" >> "$GITHUB_ENV"
            exit 0
          fi
      
          # TODO use dpkg --compare-versions instead of sort -V
          lowest=$(printf '%s\n' "$pkgbuild_version" "$upstream_version" | sort -V | head -n1)
      
          if [[ "$lowest" == "$pkgbuild_version" ]]; then
            echo "PKGBUILD is older than upstream → update needed"
            echo "has_update=true" >> "$GITHUB_ENV"
          else
            echo "PKGBUILD is NEWER than upstream. Please check manually."
            exit 1
          fi

      - name: Print versions
        run: |
          echo "mapped : ${mapped:-}"
          echo "Upstream : $upstream_version"
          echo "Upstream commit : $upstream_commit"
          echo "x.ai stable : ${stable_channel:-}"
          echo "channel note : ${channel_note:-}"
          echo "PKGBUILD : ${pkgbuild_version:-}"
          echo "has_update = ${has_update:-}"

      - name: Notify about new version
        if: ${{ env.has_update == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ env.upstream_version }}";
            const commit = "${{ env.upstream_commit }}";
            const channelNote = "${{ env.channel_note }}";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `New grok-build version: ${version}`,
              body: `@olwig\n\nNew version found: **${version} (${commit})**\n\n${channelNote}\n\nPlease update the PKGBUILD for \`grok-build\`.`
            });
