name: update-skills

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  update-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - name: Resolve target branch
        id: branch
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_TYPE:-}" == "branch" ]]; then
            branch="${GITHUB_REF_NAME}"
          else
            branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.branch }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Verify gh skill is available
        run: gh skill --help > /dev/null

      - name: Update skills
        run: gh skill update --all --dir .agents/skills

      - name: Detect skill changes
        id: changes
        run: |
          if [[ -z "$(git status --short -- .agents/skills)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit skill updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .agents/skills
          git commit -m "chore(skills): update installed skills"
          git push origin "HEAD:${{ steps.branch.outputs.branch }}"

      - name: Create issue for workflow failure
        if: ${{ always() && failure() && !cancelled() }}
        uses: actions/github-script@v7
        env:
          BRANCH_FROM_STEP: ${{ steps.branch.outputs.branch }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let branch = process.env.BRANCH_FROM_STEP;
            if (!branch) {
              if (context.eventName === 'workflow_dispatch' && context.ref.startsWith('refs/heads/')) {
                branch = context.ref.replace(/^refs\/heads\//, '');
              } else {
                const {data: repo} = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
                branch = repo.default_branch;
              }
            }
            const title = `Skill update workflow failed (${branch})`;
            const trigger = context.eventName === 'schedule' ? 'scheduled' : 'manually triggered';
            const body = [
              `The ${trigger} skill update workflow failed.`,
              '',
              `- Branch: \`${branch}\``,
              `- Workflow: \`${context.workflow}\``,
              `- Event: \`${context.eventName}\``,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
            ].join('\n');
            const issues = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
