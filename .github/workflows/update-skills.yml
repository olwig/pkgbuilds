name: update-skills

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  update-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update skills
        run: gh skill update --all --dir .agents/skills

      - name: Detect skill changes
        id: changes
        run: |
          if [[ -z "$(git status --short -- .agents/skills)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit skill updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .agents/skills
          git commit -m "chore(skills): update installed skills"
          git push

      - name: Create issue for workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Skill update workflow failed: ${new Date().toISOString().slice(0, 10)}`,
              body: [
                'The scheduled skill update workflow failed.',
                '',
                `- Workflow: \`${context.workflow}\``,
                `- Run: ${runUrl}`,
                `- Commit: ${context.sha}`,
              ].join('\n')
            });
