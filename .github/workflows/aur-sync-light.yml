name: aur-sync-light

on:
  #schedule:
  #  - cron: '0 8 * * *' 
  workflow_dispatch:
    inputs:
      push_dry_run:
        description: 'Perform a dry run of the push to AUR'
        required: false
        type: choice
        options:
          - true
          - false
        default: 'true'
      pkgs_opts:
        description: 'Select package set to sync as space-separated list. Use "all" to sync all selectable packages.'
        required: false
        type: choice
        options:
          - 'all' # all means, all the following options as space-separated list which are actual packages in the repo
          - 'list' # use separate list input (pkgs_list) with space-separated list of packages to sync
          - 'grok-build-git'
          - 'grok-build-bin'
          - 'cosmic-ext-applet-privacy-indicator'
        default: 'all'
      pkgs_list:
        description: 'space-separated list of packages to sync. Only used if pkgs_opts is set to "list".'
        required: false
        type: string
        default: ''

    
jobs:
  aur-sync:
    runs-on: ubuntu-latest

    env:
      AUR_ED25519_GITHUB: ${{ secrets.AUR_ED25519_GITHUB }}
      GIT_NAME: ${{ secrets.GIT_NAME }}
      GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
      PKGS_OPTS: ${{ github.event.inputs.pkgs_opts }}
      PKGS_LIST: ${{ github.event.inputs.pkgs_list }}
      PKGS: ""
      PUSH_DRY_RUN: ${{ github.event.inputs.push_dry_run || 'true' }}
      REPO_YML: ".github/workflows/aur-sync-light.yml"

    steps:

      - name: Checkout github repo
        uses: actions/checkout@v7
        with:
          path: repo/

      - name: Build package list from inputs
        working-directory: repo/
        run: |

          if [[ "$PKGS_OPTS" == "all" ]]; then
            wf_file=".github/workflows/aur-sync-light.yml"
            PKGS=$(yq -r '.["on"].workflow_dispatch.inputs.pkgs_opts.options | .[2:] | join(" ")' "$wf_file")
          elif [[ "$PKGS_OPTS" == "list" ]]; then
            PKGS="$PKGS_LIST"
          else
            PKGS="$PKGS_OPTS"
          fi

          echo "Normalized package list:"
          for pkg in $PKGS; do
            echo "   - $pkg"
          done

          for pkg in $PKGS; do
            if [[ ! -d "packages/$pkg" ]]; then
              echo "ERROR: Package directory 'packages/$pkg' does not exist."
              exit 1
            fi
          done

          echo "PKGS=$PKGS" >> $GITHUB_ENV

      - name: Check and set environment variables
        working-directory: repo/
        run: |

          if [[ -z "$PKGS" ]]; then
            echo "ERROR: PKGS is not set. Please set it in the workflow environment variables."
            exit 1
          fi

          if [[ -z "$AUR_ED25519_GITHUB" ]]; then
            echo "ERROR: AUR_ED25519_GITHUB is not set. Please set it in the repository secrets."
            exit 1
          fi

          if [[ -z "$GIT_NAME" || -z "$GIT_EMAIL" ]]; then
            echo "ERROR: GIT_NAME or GIT_EMAIL is not set. Please set them in the repository secrets."
            exit 1
          fi

          if [[ "${PUSH_DRY_RUN,,}" != "false" ]]; then
            PUSH_DRY_RUN=true
          fi

          if [[ -z "$REPO_YML" ]]; then
            echo "ERROR: REPO_YML is not set. Please set it to an existing repo.yml file path."
            exit 1
          fi

          if [[ ! -f "$REPO_YML" ]]; then
            echo "ERROR: REPO_YML file '$REPO_YML' does not exist."
            exit 1
          fi

      - name: Read packages specificy options
        working-directory: repo/
        run: |
          echo "TODO implement, repo.yml with package specific options"

      - name: Store helper lib
        run: |
          cat > lib.sh <<-'EOF'
            wf_get_pkgbuild_value() {
              local pkgbuild_file=$1
              local field=$2
              local value
              value=$(awk -v field="$field" '
                $0 ~ "^[[:space:]]*"field"=" {
                  sub(/^[[:space:]]*'"$field"'=[[:space:]]*/, "")
                  sub(/[[:space:]]*#.*$/, "")
                  gsub(/^["'\'']+|["'\'']+$/, "")
                  print
                  exit
                }
              ' "$pkgbuild_file")
              echo "$value"
            }

            wf_get_pkgbuild_version() {
              local pkgbuild_file=$1
              local pkgver=$(wf_get_pkgbuild_value "$pkgbuild_file" "pkgver")
              local pkgrel=$(wf_get_pkgbuild_value "$pkgbuild_file" "pkgrel")
              echo "$pkgver-$pkgrel"
            }

            wf_print() {
              local msg=$1
              echo "ℹ️  $msg"
            }

            wf_error() {
              local msg=$1
              echo "❌  $msg"
            }

            wf_version_gt() {
              local ver1=$1
              local ver2=$2
              local pkg=$3

              # normalize version if -git pkg. commit hash will be removed for comparison
              if [[ "$pkg" == *-git ]]; then
                norm() {   
                  # remove ecommit hash, not compatible with dpkg
                  # starting with, witthing upstream tag seems to work despite warning
                  # # TODO keep an eye on this version comparison
                  echo "$1" | sed -E 's/\.[0-9a-f]{7,}//'; 
                }
                ver1=$(norm "$ver1")
                ver2=$(norm "$ver2")
              fi

              # TODO suppress stdout to hide warning, if comparison never fails
              dpkg --compare-versions "$ver1" gt "$ver2" && return 0 || return 1
            }
          EOF

      - name: Prepare runner
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync tree

      - name: Setup AUR SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_ED25519_GITHUB" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/config << EOF
            Host aur.archlinux.org
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              User aur
          EOF

          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repositories
        run: |
          . lib.sh

          wf_print " => Packages to clone: $pkgs"

          pkgs=${PKGS:-}
          for pkg in $pkgs; do
            pkg_dir="aur/$pkg"
            url="ssh://aur@aur.archlinux.org/$pkg.git"

            mkdir -p "$pkg_dir"

            wf_print " ===> Cloning $url into $pkg_dir"
            git clone $url "$pkg_dir" || {
              wf_error " ===> Failed to clone $url into $pkg_dir"
              exit 1
            }
          done

      - name: Dump tree
        run: |
          echo "Dumping directory tree for debugging:"
          tree -a -L 4 -I '.git'      

      - name: Sync AUR
        run: |
          . lib.sh

          pkgs=${PKGS:-}

          wf_print "=============================================="
          wf_print "Packages to update:"
          for pkg in $pkgs; do
            wf_print "   - $pkg"
          done
          
          for pkg in $pkgs; do
            wf_print "=============================================="
            wf_print " => Working on package: $pkg"
            
            monorepo_dir="repo"
            aurrepo_dir="aur/$pkg"
            
            src_dir="$monorepo_dir/packages/$pkg"
            dest_dir="$aurrepo_dir"
 
            wf_print " ===> Force copying files from $src_dir to $dest_dir"
            # TODO: remove forced copy after sync logic is verified. -avIW => -avc
            rsync -avIW --delete --progress --exclude '.git' "$src_dir/." "$dest_dir/"

            # double check that all files were copied correctly
            changes=$(diff -rq --exclude=.git "$src_dir/." "$dest_dir/")
            if [[ -n "$changes" ]]; then
              wf_error " ===> Not all files copied correctly."
            fi
            wf_print " ===> All files copied correctly."

            wf_print " ===> Git adding changes in $dest_dir"
            git -C "$aurrepo_dir" add -A
            git -C "$aurrepo_dir" status

            # go further only index differs from HEAD
            if git -C "$aurrepo_dir" diff --cached --quiet; then
              wf_print " ===> No changes to commit for package $pkg."
              continue
            fi
            
            git config --global user.name "$GIT_NAME"
            git config --global user.email "$GIT_EMAIL"
            hash=$(git -C "$monorepo_dir" rev-parse HEAD)

            ver=$(wf_get_pkgbuild_version "$dest_dir/PKGBUILD")
            printf -v msg 'upgpkg: %s %s\n\nsync from github.com/%s\nsource commit: %s' \
              "$pkg" "$ver" "$GITHUB_REPOSITORY" "$hash"
            wf_print " ===> Committing changes with message:\n$msg"

            git -C "$aurrepo_dir" commit -m "$msg"

            push_cmd=(git -C "$aurrepo_dir" push)
            if [[ "$PUSH_DRY_RUN" == "true" ]]; then
              wf_print "Performing a dry run of the push."
              push_cmd+=(--dry-run)
            fi
            "${push_cmd[@]}"
          done
          wf_print "=============================================="
